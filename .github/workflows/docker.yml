name: Build ZCode Web Docker Image

# 从 zai-org/ZCode 官方源码构建 CLI 发行包（纯 Node 运行时），
# 打成 Docker 镜像推送 ghcr.io。
# 路由器为 ARM64，公共仓库可免费使用原生 arm64 runner，无需 QEMU。
on:
  push:
    branches: [master, main]
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build ${{ matrix.suffix }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest        # x86_64
            suffix: amd64
          - os: ubuntu-24.04-arm     # 原生 ARM64（公共仓库免费）
            suffix: arm64
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24.14.0
        uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"

      - name: Install pnpm 10.33.2
        run: npm install -g pnpm@10.33.2

      - name: Clone ZCode source
        run: git clone --depth 1 https://github.com/zai-org/ZCode.git zcode-src

      - name: Read ZCode version
        id: version
        run: echo "version=$(node -p "require('./zcode-src/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Bootstrap workspace
        run: |
          cd zcode-src
          HUSKY=0 CI=1 ELECTRON_MIRROR=https://npmmirror.com/mirrors/electron/ pnpm bootstrap

      - name: Build zcode runtime tarball
        run: |
          cd zcode-src
          pnpm build:zcode --base-url http://127.0.0.1/zcode/

      - name: Stage tarball for Docker build
        run: |
          cp zcode-src/dist/zcode/releases/*/zcode-*.tar.gz ./
          ls -lh zcode-*.tar.gz

      - name: Release build workspace (free disk)
        run: rm -rf zcode-src/node_modules

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: zcode-runtime-${{ matrix.suffix }}
          path: zcode-*.tar.gz
          retention-days: 14
          if-no-files-found: error

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push arch image
        run: |
          IMAGE="${IMAGE_NAME,,}"
          V="${{ steps.version.outputs.version }}"
          docker build \
            -t "$IMAGE:latest-${{ matrix.suffix }}" \
            -t "$IMAGE:$V-${{ matrix.suffix }}" .
          docker push "$IMAGE:latest-${{ matrix.suffix }}"
          docker push "$IMAGE:$V-${{ matrix.suffix }}"

  manifest:
    name: Merge multi-arch manifest
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Create and push multi-arch tags
        run: |
          IMAGE="${IMAGE_NAME,,}"
          V="${{ needs.build.outputs.version }}"
          for TAG in "latest" "$V"; do
            docker manifest create "$IMAGE:$TAG" \
              "$IMAGE:$TAG-amd64" \
              "$IMAGE:$TAG-arm64"
            docker manifest push "$IMAGE:$TAG"
          done
